---
###############################################################################
# No Actions
###############################################################################
# No actions when pre-enrolled keys with secure boot state already 'enabled'.
#
# State:
# * pre-enrolled keys? True.
# * pre-enabled secure boot? True.
#
# Tests:
# * Verify call log does not contain operations:
#   --generate-hash=ValidPassword
#   --sb-state
#   --test-key /var/lib/dkms/mok.pub

dependency:
  name: 'galaxy'
driver:
  name: 'podman'
provisioner:
  name: 'ansible'
  config_options:
    defaults:
      interpreter_python: 'auto_silent'
      callback_whitelist: 'profile_tasks, timer, yaml'
    ssh_connection:
      pipelining: false
  inventory:
    group_vars:
      all:
        secure_boot_testing_enable: true
        secure_boot_password: 'ValidPassword'
platforms:
  - name: 'secure_boot-debian-12-no_actions'
    image: 'ghcr.io/hifis-net/debian-systemd:12'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
verifier:
  name: 'ansible'
lint: |
  set -e
  yamllint .
  ansible-lint .
scenario:
  test_sequence:
    # - 'dependency'
    # - 'cleanup'
    - 'destroy'
    - 'syntax'
    - 'create'
    - 'prepare'
    - 'converge'
    # - 'idempotence'  # hashed password file always regenerated if needed
    # - 'side_effect'
    - 'verify'
    # - 'cleanup'
    - 'destroy'
