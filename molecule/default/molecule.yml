---
###############################################################################
# Default
###############################################################################
# Enroll keys with default options in default state.
#
# Tests:
# * Verify call log contains expected operations:
#   --generate-hash=ValidPassword
#   --sb-state
#   --test-key /var/lib/dkms/mok.pub
#   --timeout -1
#   --import /var/lib/dkms/mok.pub --hash-file /tmp/.mokhash
#   --timeout -1
#   --enable-validation --hash-file /tmp/.mokhash

dependency:
  name: 'galaxy'
driver:
  name: 'podman'
provisioner:
  name: 'ansible'
  config_options:
    defaults:
      interpreter_python: 'auto_silent'
      callback_whitelist: 'profile_tasks, timer, yaml'
    ssh_connection:
      pipelining: false
  inventory:
    group_vars:
      all:
        secure_boot_testing_enable: true
        secure_boot_password: 'ValidPassword'
platforms:
  - name: 'secure_boot-debian-13-default'
    image: 'ghcr.io/hifis-net/debian-systemd:13'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
verifier:
  name: 'ansible'
lint: |
  set -e
  yamllint .
  ansible-lint .
scenario:
  test_sequence:
    # - 'dependency'
    # - 'cleanup'
    - 'destroy'
    - 'syntax'
    - 'create'
    # - 'prepare'
    - 'converge'
    # - 'idempotence'  # hashed password file always regenerated if needed
    # - 'side_effect'
    - 'verify'
    # - 'cleanup'
    - 'destroy'
