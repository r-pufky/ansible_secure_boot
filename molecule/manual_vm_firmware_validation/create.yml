---
- name: 'Manual VM firmware validation | create'
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  tasks:
    - name: 'Manual VM firmware validation | create | molecule inventory'
      ansible.builtin.debug:
        msg: skipping provisioning

    - name: 'Manual VM firmware validation | create | populate instance config'
      ansible.builtin.set_fact:
        instance_conf_dict: {'instance': '{{ item.name }}'}
      loop: '{{ molecule_yml.platforms }}'
      register: instance_config_dict
